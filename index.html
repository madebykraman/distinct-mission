<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Kumar Aman, Creative Director. Creative direction for brands, campaigns and cultural storytelling across film, design and digital media."><title>Kumar Aman | Creative Director</title><link rel="stylesheet" href="https://raw.githubusercontent.com/madebykraman/port0.5-proandsite/main/assets/style.css"><style>body{background:#0a0a0a;color:#f0f0f0}.site-header{background:#0a0a0a;color:#fff}.page{padding-top:64px}.ref-section{padding:128px 24px}.ref-inner{max-width:1440px;margin:auto}.ref-head{display:grid;grid-template-columns:2fr 4fr;gap:24px;margin-bottom:64px}.ref-head h1,.ref-head h2{margin:0;font-size:clamp(48px,6vw,88px);line-height:.9;letter-spacing:-.06em;font-weight:500}.ref-label{color:#878787;font:12px monospace;text-transform:uppercase}.ref-copy{color:#bfbfbf;font-size:18px;line-height:1.45}.ref-work{display:flex;flex-direction:column;gap:48px}.ref-card{width:min(100%,1200px);margin:auto}.ref-media{aspect-ratio:1.765;border-radius:8px;overflow:hidden;background:#111;border:1px solid #262626}.ref-media img{width:100%;height:100%;object-fit:cover;transition:transform .7s}.ref-card:hover img{transform:scale(1.035)}.ref-meta{display:flex;justify-content:space-between;padding-top:14px;color:#878787;font:12px monospace;text-transform:uppercase}.dark-section{background:#0a0a0a;color:#f0f0f0}.black-grid{border-top:1px solid #262626}.black-row{display:grid;grid-template-columns:2fr 3fr 1fr;gap:24px;padding:30px 0;border-bottom:1px solid #262626}.black-row h3{margin:0;font-size:28px;font-weight:500}.black-row p{margin:8px 0 0;color:#bfbfbf;line-height:1.45}.black-meta{text-align:right;color:#878787;font:11px monospace;text-transform:uppercase}.ref-cta{padding:150px 24px}.ref-cta h2{margin:0;font-size:clamp(64px,9vw,128px);line-height:.82;letter-spacing:-.07em;font-weight:500}.ref-cta em{font-family:Georgia,seri const projects=[["smiley-co","Smiley Co","Smilecorp Ltd","smiley"],["circular","Circular","Circular Health","circular"],["ode","ODE","Studio Coda","ode"],["deadpan-supply","Deadpan Supply","Deadpan Supply Company","deadpan"]];const arts={"smiley":"https://raw.githubusercontent.com/madebykraman/port0.5-proandsite/main/assets/smiley.svg","circular":"https://raw.githubusercontent.com/madebykraman/port0.5-proandsite/main/assets/circular.svg","ode":"https://raw.githubusercontent.com/madebykraman/port0.5-proandsite/main/assets/ode.svg","deadpan":"https://raw.githubusercontent.com/madebykraman/port0.5-proandsite/main/assets/deadpan.svg"};const services=[['01','Campaign Films','Narrative driven brand films developed to communicate brand positioning through cinematic storytelling.'],['02','Integrated Campaign','Cross platform campaign combining film, motion and digital storytelling to launch a brand initiative.'],['03','Brand Identity System','Designing scalable brand identity and visual systems built for consistency across digital platforms.'],['04','Cultural Brand Film','Short documentary style film created to build emotional connection between brand and audience.'],['05','Digital Motion Campaign','Motion led storytelling designed for digital campaigns and social distribution.'],['06','Commercial Film Direction','Advertising film directed for brand storytelling across digital and broadcast platforms.']];function cards(){return `<div class="ref-work">${projects.map(p=>`<a class="ref-card reveal" href="/work/${p[0]}"><div class="ref-media"><img src="${arts[p[3]]}" alt="${p[1]}"></div><div class="ref-meta"><span>${p[1]}</span><span>${p[2]}</span></div></a>`).join('')}</div>`}function serviceRows(){return `<div class="black-grid">${services.map(s=>`<div class="black-row reveal"><div class="mono">${s[0]}</div><div><h3>${s[1]}</h3><p>${s[2]}</p></div><div class="black-meta">Creative direction<br>Visual language<br>Production</div></div>`).join('')}</div>`}function home(){return </p><a class="ref-btn" href="mailto:work@kumaraman.pro">Email Kumar</a></div></section>`;else if(path.startsWith('/work/')){let p=projects.find(x=>x[0]===path.split('/')[2]);out=p?page(p[1],'A selected project in Kumar Aman’s portfolio.','Project')+`<section class="ref-section dark-section"><div class="ref-inner"><div class="ref-media"><img src="${arts[p[3]]}" alt="${p[1]}"></div><div class="ref-meta"><span>${p[1]}</span><span>${p[2]}</span></div></div></section><section class="ref-section dark-section"><div class="ref-inner"><div class="ref-head"><div class="ref-label">Project</div><div><p class="ref-copy">${p[1]} is presented as part of Kumar Aman’s selected portfolio work. The project and client naming follow the current content source.</p></div></div></div></section>`:page('Project not found','The requested project does not exist.','Project')}else out=home();document.querySelector('#app').innerHTML=out;document.querySelectorAll('.reveal').forEach(x=>observer.observe(x));document.title=(path==='/'?'Kumar Aman | Creative Director':path.split('/').filter(Boolean).slice(-1)[0]+' | Kumar Aman')}const observer=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&e.target.classList.add('visible')),{threshold:.08});document.addEventListener('click',e=>{const a=e.target.closest('a');if(!a||a.target==='_blank'||a.origin!==location.origin)return;const p=new URL(a.href).pathname;if(['/','/work','/about','/services','/contact'].includes(p)||p.startsWith('/work/')){e.preventDefault();history.pushState({},'',p);render();scrollTo(0,0)}});addEventListener('popstate',()=>{render();scrollTo(0,0)});render();</script></body></html>
